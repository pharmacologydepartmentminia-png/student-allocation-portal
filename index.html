<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Department Preference Form</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6; 
            color: #333; 
        }
        .container { 
            max-width: 600px; 
            margin: 20px auto; 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
        }
        h1 { 
            color: #1a365d; 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 20px; 
            font-size: 24px;
        }
        h3 {
            color: #2c5282;
            margin-bottom: 15px;
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            font-weight: bold; 
            margin-bottom: 8px; 
            color: #2d3748; 
        }
        select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cbd5e0; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 15px; 
            background-color: #fff; 
        }
        select:disabled { 
            background-color: #edf2f7; 
            cursor: not-allowed; 
        }
        button { 
            background-color: #2f855a; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            font-size: 16px; 
            margin-top: 10px; 
        }
        button:hover { 
            background-color: #276749; 
        }
        button:disabled { 
            background-color: #a0aec0; 
            cursor: not-allowed; 
        }
        #loadingMsg { 
            text-align: center; 
            color: #3182ce; 
            font-weight: bold; 
            margin-bottom: 15px; 
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Department Preference Form</h1>
        <div id="loadingMsg">Loading options from Google Sheets...</div>

        <form id="preferenceForm" style="display:none;" onsubmit="submitForm(event)">
            <div class="form-group">
                <label for="waveSelect">1. Select Your Wave Number:</label>
                <select id="waveSelect" required onchange="filterStudentsByWave()">
                    <option value="">-- Choose Wave --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="studentSelect">2. Select Your Name:</label>
                <select id="studentSelect" required disabled>
                    <option value="">-- Select Wave First --</option>
                </select>
            </div>

            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 25px 0;">

            <div id="departmentsContainer"></div>

            <button type="submit" id="submitBtn">Submit My Preferences</button>
        </form>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyC0f5f1oVLCZeTUzp49ticE3yA0QiqDskrOY-knMLGIgVIf7tWEwxgtvnT__HDH-xfZA/exec";

        let allStudents = [];
        let allDepartments = [];

        window.addEventListener('DOMContentLoaded', () => {
            const loadingMsg = document.getElementById('loadingMsg');

            fetch(GOOGLE_SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    console.log("Raw Sheet Data Received:", data);

                    allStudents = data.students || [];
                    allDepartments = data.departments || [];

                    if (!Array.isArray(allStudents) || allStudents.length === 0) {
                        loadingMsg.innerText = "No pending students found or all preferences are submitted.";
                        loadingMsg.style.color = "#d69e2e";
                        return;
                    }

                    populateWaveDropdown();
                    buildDepartmentDropdowns();

                    loadingMsg.style.display = 'none';
                    document.getElementById('preferenceForm').style.display = 'block';
                })
                .catch(err => {
                    console.error("Fetch error:", err);
                    loadingMsg.innerText = "Error loading data. Check Console (F12) for details.";
                    loadingMsg.style.color = "#c53030";
                });
        });

        function populateWaveDropdown() {
            const waveSelect = document.getElementById('waveSelect');
            waveSelect.innerHTML = '<option value="">-- Choose Wave --</option>';

            const waveSet = new Set();
            allStudents.forEach(s => {
                let w = (s.wave !== undefined && s.wave !== null && String(s.wave).trim() !== "") 
                        ? String(s.wave).trim() 
                        : "1";
                waveSet.add(w);
            });

            const waves = Array.from(waveSet).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

            waves.forEach(wave => {
                const opt = document.createElement('option');
